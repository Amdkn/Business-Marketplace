name: CI

# Un franchisé qui clone ce dépôt doit obtenir, sans connaissance tacite, le
# même verdict que cette pipeline. Chaque étape échoue bruyamment — aucune
# n'est autorisée à masquer un échec pour faire passer le vert.
#
# Ordre délibéré : install -> typecheck -> API typecheck -> tests -> build -> runtime benches.
# Le dépôt canonique utilise bun.lock. package-lock.json est un vestige Coach OS
# et ne décrit pas les dépendances actuelles du Marketplace : npm ci est donc
# volontairement exclu de cette pipeline.

on:
  push:
    branches: [main, foundation/marketplace-product-identity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node (version .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun (version used by Vercel)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies (canonical lockfile, frozen)
        run: bun install --frozen-lockfile

      # PIÈGE CONNU : le tsconfig.json racine ne compile pas directement les
      # sources ; tsc -b suit les références vers tsconfig.app.json et
      # tsconfig.node.json.
      - name: Typecheck (app + node)
        run: bun run typecheck

      # api/ tourne sous Node et n'est pas couvert par les références racine.
      - name: Typecheck (api/)
        run: bun run typecheck:api

      - name: Tests (Vitest, threads)
        run: bun run test

      - name: Build
        run: bun run build

      - name: Bench — kernel (27 tests)
        run: bun run bench:kernel

      - name: Bench — bridge (20 tests)
        run: bun run bench:bridge

      - name: Bench — adapters (39 tests)
        run: bun run bench:adapters

      - name: Bench — rbac (16 tests)
        run: bun run bench:rbac
